services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: prreview
      POSTGRES_PASSWORD: prreview
      POSTGRES_DB: prreview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prreview"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://prreview:prreview@db:5432/prreview
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    # Applique les migrations puis démarre l'API.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/code

volumes:
  pgdata:
